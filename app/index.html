<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Tracker</title>
  <meta name="description" content="Registro personal de entrenamientos: pesos, reps, notas e historial por ciclo.">
  <meta name="theme-color" content="#1F3C56">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" data-icon="dumbbell"></span>
      <span class="brand-title">Gym Tracker</span>
    </div>
    <span id="cycleChip" class="chip" hidden></span>
    <button class="icon-btn glossary-top-btn" data-action="open-glossary" data-icon="info" aria-label="Glosario"></button>
    <button class="icon-btn settings-btn" data-action="open-settings" data-icon="gear" aria-label="Ajustes"></button>
  </header>

  <div id="updateBanner" class="banner" hidden>
    <span>Hay una versión nueva de la app.</span>
    <button class="link-btn reload-btn" data-action="reload-app">Actualizar</button>
  </div>

  <main id="root"><p class="empty">Cargando…</p></main>

  <nav class="tabbar" aria-label="Secciones">
    <button class="tab active" data-action="tab" data-tab="rutina" data-icon="list">Rutina</button>
    <button class="tab" data-action="tab" data-tab="historial" data-icon="chart">Historial</button>
  </nav>

  <div id="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
